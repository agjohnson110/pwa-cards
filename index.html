<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 maximum-scale=1, user-scalable=no">
    <title>Freecell</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#007bff">
</head>
<body>
    <div id="game">
        <div id="top-area">
            <div id="foundations">
                <div class="foundation" id="found1"></div>
                <div class="foundation" id="found2"></div>
                <div class="foundation" id="found3"></div>
                <div class="foundation" id="found4"></div>
            </div>
            <div id="free-cells">
                <div class="cell" id="free1"></div>
                <div class="cell" id="free2"></div>
                <div class="cell" id="free3"></div>
                <div class="cell" id="free4"></div>
            </div>
        </div>
        <div id="tableau">
            <div class="column" id="col1"></div>
            <div class="column" id="col2"></div>
            <div class="column" id="col3"></div>
            <div class="column" id="col4"></div>
            <div class="column" id="col5"></div>
            <div class="column" id="col6"></div>
            <div class="column" id="col7"></div>
            <div class="column" id="col8"></div>
        </div>
    </div>
    <div class="number-bar">
        <div class="num" data-value="clubs">♣</div>
        <div class="num" data-value="diamonds">♦</div>
        <div class="num" data-value="hearts">♥</div>
        <div class="num" data-value="spades">♠</div>
        <div class="num" data-value="A">A</div>
        <div class="num" data-value="2">2</div>
        <div class="num" data-value="3">3</div>
        <div class="num" data-value="4">4</div>
        <div class="num" data-value="1">5</div>
        <div class="num" data-value="2">6</div>
        <div class="num" data-value="3">7</div>
        <div class="num" data-value="4">8</div>
        <div class="num" data-value="1">9</div>
        <div class="num" data-value="2">10</div>
        <div class="num" data-value="3">J</div>
        <div class="num" data-value="4">Q</div>
        <div class="num" data-value="4">K</div>
    </div>
    <button class="top-button undo" data-action="undo">↺</button>
    <button class="top-button settings" data-action="options">⚙</button>
    <script src="js/app.js"></script>
</body>
</html>

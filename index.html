<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Freecell</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/settings.css">
    <meta name="theme-color" content="#007bff">
</head>
<body>
    <div id="game">
        <div id="score-bar">
            <div class="scoretext" id="moves">Moves: 0</div>
            <div class="scoretext" id="timer">Time: 0:00</div>
            <div class="scoretext" id="score">Score: 0</div>
        </div>
        <div id="top-area">
            <div id="foundations">
                <div class="foundation" id="found1" data-pile-type="foundation" data-pile-index="0"></div>
                <div class="foundation" id="found2" data-pile-type="foundation" data-pile-index="1"></div>
                <div class="foundation" id="found3" data-pile-type="foundation" data-pile-index="2"></div>
                <div class="foundation" id="found4" data-pile-type="foundation" data-pile-index="3"></div>
            </div>
            <div id="free-cells">
                <div class="cell" id="free1" data-pile-type="cell" data-pile-index="0"></div>
                <div class="cell" id="free2" data-pile-type="cell" data-pile-index="1"></div>
                <div class="cell" id="free3" data-pile-type="cell" data-pile-index="2"></div>
                <div class="cell" id="free4" data-pile-type="cell" data-pile-index="3"></div>
            </div>
        </div>
        <div id="tableau">
            <div class="column" id="col1" data-pile-type="column" data-pile-index="0"></div>
            <div class="column" id="col2" data-pile-type="column" data-pile-index="1"></div>
            <div class="column" id="col3" data-pile-type="column" data-pile-index="2"></div>
            <div class="column" id="col4" data-pile-type="column" data-pile-index="3"></div>
            <div class="column" id="col5" data-pile-type="column" data-pile-index="4"></div>
            <div class="column" id="col6" data-pile-type="column" data-pile-index="5"></div>
            <div class="column" id="col7" data-pile-type="column" data-pile-index="6"></div>
            <div class="column" id="col8" data-pile-type="column" data-pile-index="7"></div>
        </div>
    </div>
    <div class="number-bar">
        <div class="num" data-value="clubs">♣</div>
        <div class="num" data-value="diamonds">♦</div>
        <div class="num" data-value="hearts">♥</div>
        <div class="num" data-value="spades">♠</div>
        <div class="num" data-value="A">A</div>
        <div class="num" data-value="2">2</div>
        <div class="num" data-value="3">3</div>
        <div class="num" data-value="4">4</div>
        <div class="num" data-value="5">5</div>
        <div class="num" data-value="6">6</div>
        <div class="num" data-value="7">7</div>
        <div class="num" data-value="8">8</div>
        <div class="num" data-value="9">9</div>
        <div class="num" data-value="10">10</div>
        <div class="num" data-value="J">J</div>
        <div class="num" data-value="Q">Q</div>
        <div class="num" data-value="K">K</div>
    </div>
    <button class="top-button undo" data-action="undo">↺</button>
    <button class="top-button settings" data-action="settings">⚙</button>
    <h1 id="win-message">You Win!</h1>
    <div id="win-stats"></div>
    <button id="middle-btn-new-game">
        <span class="action-icon">➕</span>
        <span>New Game</span>
    </button>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

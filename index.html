<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freecell PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#007bff">
</head>
<body>
    <div id="game">
        <div id="free-cells">
            <div class="cell" id="free1"></div>
            <div class="cell" id="free2"></div>
            <div class="cell" id="free3"></div>
            <div class="cell" id="free4"></div>
        </div>
        <div id="foundations">
            <div class="foundation" id="found1"></div>
            <div class="foundation" id="found2"></div>
            <div class="foundation" id="found3"></div>
            <div class="foundation" id="found4"></div>
        </div>
        <div id="tableau">
            <div class="column" id="col1"></div>
            <div class="column" id="col2"></div>
            <div class="column" id="col3"></div>
            <div class="column" id="col4"></div>
            <div class="column" id="col5"></div>
            <div class="column" id="col6"></div>
            <div class="column" id="col7"></div>
            <div class="column" id="col8"></div>
        </div>
    </div>
    <button id="new-game">New Game</button>
    <div id="app-version">v0.1.0</div>
    <script src="js/app.js"></script>
</body>
</html>

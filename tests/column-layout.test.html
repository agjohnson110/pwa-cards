<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>columnLayout tests</title>
    <style>
        body { font-family: monospace; padding: 1rem; }
        .pass { color: green; }
        .fail { color: red; font-weight: bold; }
        .info { color: #888; font-style: italic; }
        h2    { margin-top: 1.5rem; }
        #summary { margin-top: 1.5rem; font-size: 1.2rem; font-weight: bold; }

        /* Give the tableau real dimensions so getBoundingClientRect() returns non-zero */
        #tableau {
            position: relative;
            width: 600px;
            height: 400px;
            border: 1px dashed #ccc;
        }
        .column {
            position: absolute;
            width: 60px;
            top: 0;
        }
        #col1 { left: 0; }
        #col2 { left: 70px; }

        .card {
            position: relative;
            width: 60px;
            height: 90px;
            background: white;
            border: 1px solid #333;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1>columnLayout.js tests</h1>
    <p class="info">These tests use a real rendered tableau so getBoundingClientRect() returns real values.</p>

    <!-- Minimal 2-column tableau fixture -->
    <div id="tableau">
        <div class="column" id="col1"></div>
        <div class="column" id="col2"></div>
    </div>

    <div id="results"></div>
    <div id="summary"></div>

    <script src="../js/columnLayout.js"></script>
    <script>
        const results = document.getElementById('results');
        let passed = 0;
        let failed = 0;

        function test(description, fn) {
            try {
                fn();
                results.innerHTML += `<p class="pass">✓ ${description}</p>`;
                passed++;
            } catch (e) {
                results.innerHTML += `<p class="fail">✗ ${description}: ${e.message}</p>`;
                failed++;
            }
        }

        function assert(condition, message) {
            if (!condition) throw new Error(message || 'Assertion failed');
        }

        function assertEqual(actual, expected, message) {
            const a = JSON.stringify(actual);
            const e = JSON.stringify(expected);
            if (a !== e) throw new Error(message || `Expected ${e} but got ${a}`);
        }

        function makeLayout(overrides = {}) {
            return new ColumnLayout({
                tableauId:    'tableau',
                columnPrefix: 'col',
                columnCount:  2,
                ...overrides,
            });
        }

        function addCards(colId, count) {
            const col = document.getElementById(colId);
            col.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                col.appendChild(card);
            }
        }

        function resetColumns() {
            ['col1', 'col2'].forEach(id => {
                const el = document.getElementById(id);
                el.innerHTML = '';
                el.style.removeProperty('--card-offset');
            });
        }

        // ─── Constructor ──────────────────────────────────────────────────────────

        results.innerHTML += `<h2>constructor</h2>`;

        test('defaults to tableau id "tableau"', () => {
            const l = new ColumnLayout();
            assertEqual(l.tableauId, 'tableau');
        });

        test('defaults to column prefix "col"', () => {
            const l = new ColumnLayout();
            assertEqual(l.columnPrefix, 'col');
        });

        test('defaults to 10 columns', () => {
            const l = new ColumnLayout();
            assertEqual(l.columnCount, 10);
        });

        test('accepts custom columnCount', () => {
            const l = new ColumnLayout({ columnCount: 8 });
            assertEqual(l.columnCount, 8);
        });

        test('accepts custom tableauId', () => {
            const l = new ColumnLayout({ tableauId: 'my-tableau' });
            assertEqual(l.tableauId, 'my-tableau');
        });

        // ─── adjust() — safety / edge cases ──────────────────────────────────────

        results.innerHTML += `<h2>adjust() — safety</h2>`;

        test('does not throw when tableau element does not exist', () => {
            const l = new ColumnLayout({ tableauId: 'nonexistent' });
            l.adjust(); // should not throw
            assert(true);
        });

        test('does not throw when columns are empty', () => {
            resetColumns();
            const l = makeLayout();
            l.adjust();
            assert(true);
        });

        test('does not throw when columns have one card', () => {
            resetColumns();
            addCards('col1', 1);
            const l = makeLayout();
            l.adjust();
            assert(true);
        });

        test('removes --card-offset for empty column', () => {
            resetColumns();
            document.getElementById('col1').style.setProperty('--card-offset', '-95%');
            const l = makeLayout();
            l.adjust();
            const val = document.getElementById('col1').style.getPropertyValue('--card-offset');
            assertEqual(val, '', '--card-offset should be removed for empty column');
        });

        test('removes --card-offset for column with one card', () => {
            resetColumns();
            addCards('col1', 1);
            document.getElementById('col1').style.setProperty('--card-offset', '-95%');
            const l = makeLayout();
            l.adjust();
            const val = document.getElementById('col1').style.getPropertyValue('--card-offset');
            assertEqual(val, '', '--card-offset should be removed for single-card column');
        });

        // ─── adjust() — compression ───────────────────────────────────────────────

        results.innerHTML += `<h2>adjust() — compression</h2>`;

        test('removes --card-offset when a few cards fit at default overlap', () => {
            resetColumns();
            addCards('col1', 2); // 2 cards in a 400px tall tableau — easily fits
            const l = makeLayout();
            l.adjust();
            const val = document.getElementById('col1').style.getPropertyValue('--card-offset');
            assertEqual(val, '', 'Should not compress when cards fit at default overlap');
        });

        test('sets --card-offset when too many cards to fit at default overlap', () => {
            resetColumns();
            addCards('col1', 10); // 10 x 90px cards will overflow a 400px tableau
            const l = makeLayout();
            l.adjust();
            const val = document.getElementById('col1').style.getPropertyValue('--card-offset');
            assert(val !== '', '--card-offset should be set when column overflows');
            assert(val.endsWith('%'), '--card-offset should be a percentage value');
        });

        test('--card-offset value is negative when compressing', () => {
            resetColumns();
            addCards('col1', 10);
            const l = makeLayout();
            l.adjust();
            const val = parseFloat(document.getElementById('col1').style.getPropertyValue('--card-offset'));
            assert(val < 0, '--card-offset should be negative to create overlap');
        });

        test('more cards means more compression (more negative offset)', () => {
            resetColumns();
            // Both counts must overflow the 400px tableau so both get an offset set.
            // 10 cards: 90 + 9 * 36 = 414px — just overflows.
            // 14 cards: 90 + 13 * 36 = 558px — overflows more.
            addCards('col1', 10);
            addCards('col2', 14);
            const l = makeLayout();
            l.adjust();
            const val1 = parseFloat(document.getElementById('col1').style.getPropertyValue('--card-offset'));
            const val2 = parseFloat(document.getElementById('col2').style.getPropertyValue('--card-offset'));
            assert(!isNaN(val1), 'col1 should have --card-offset set (overflows tableau)');
            assert(!isNaN(val2), 'col2 should have --card-offset set (overflows tableau)');
            assert(val2 < val1, 'More cards should produce a more negative (tighter) offset');
        });

        test('columns are adjusted independently', () => {
            resetColumns();
            addCards('col1', 2);  // fits — no compression
            addCards('col2', 10); // overflows — needs compression
            const l = makeLayout();
            l.adjust();
            const val1 = document.getElementById('col1').style.getPropertyValue('--card-offset');
            const val2 = document.getElementById('col2').style.getPropertyValue('--card-offset');
            assertEqual(val1, '', 'col1 should not be compressed');
            assert(val2 !== '',   'col2 should be compressed');
        });

        test('adjust() is safe to call multiple times', () => {
            resetColumns();
            addCards('col1', 10);
            const l = makeLayout();
            l.adjust();
            const first = document.getElementById('col1').style.getPropertyValue('--card-offset');
            l.adjust();
            const second = document.getElementById('col1').style.getPropertyValue('--card-offset');
            assertEqual(first, second, 'Repeated calls should produce the same result');
        });

        // ─── configuration ────────────────────────────────────────────────────────

        results.innerHTML += `<h2>configuration</h2>`;

        test('only adjusts up to columnCount columns', () => {
            resetColumns();
            addCards('col1', 10);
            addCards('col2', 10);
            // columnCount: 1 means only col1 is touched
            const l = new ColumnLayout({ tableauId: 'tableau', columnPrefix: 'col', columnCount: 1 });
            l.adjust();
            const val2 = document.getElementById('col2').style.getPropertyValue('--card-offset');
            assertEqual(val2, '', 'col2 should be untouched when columnCount is 1');
        });

        // ─── Clean up ─────────────────────────────────────────────────────────────
        resetColumns();

        // ─── Summary ─────────────────────────────────────────────────────────────
        const summary = document.getElementById('summary');
        const total = passed + failed;
        summary.textContent = `${passed} / ${total} tests passed`;
        summary.style.color = failed === 0 ? 'green' : 'red';
    </script>
</body>
</html>
